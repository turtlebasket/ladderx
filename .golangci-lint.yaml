version: "2"

linters:
  default: standard
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: handlers/proxy.go
        text: "c.SendStatus"
      - linters:
          - unused
        path: handlers/proxy.go
        text: "func applyRules is unused"
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

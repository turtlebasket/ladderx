name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build container
        run: docker build --build-arg VERSION="$GITHUB_SHA" --tag ladder:ci .

      - name: Smoke test container
        run: |
          docker run --detach --name ladder-ci \
            --publish 127.0.0.1:8080:8080 \
            --env RULESET=/ruleset.yaml \
            --volume "$GITHUB_WORKSPACE/ruleset.yaml:/ruleset.yaml:ro" \
            ladder:ci
          trap 'docker logs ladder-ci; docker rm --force ladder-ci' EXIT
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8080/ | grep --fixed-strings --quiet '<title>ladder</title>'
